[project]
name = "claude-meter"
version = "0.1.0"
description = "KDE system-tray meter for Claude Max plan usage limits"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.5"]

[project.gui-scripts]
claude-meter = "claude_meter.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
